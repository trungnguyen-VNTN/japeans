name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Empty database: enough for `next build` (dictionary pages render on request).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: japeans
          POSTGRES_PASSWORD: japeans_ci
          POSTGRES_DB: japeans
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U japeans"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://japeans:japeans_ci@localhost:5432/japeans?schema=public
      MEILI_HOST: http://localhost:7700
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci # postinstall runs prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Migrate database
        run: npx prisma migrate deploy --config prisma7.config.ts

      - name: Build
        run: npx next build
